<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANON</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================= TITLE ============================= -->
<div id="title" class="screen">
  <div class="title-inner">
    <h1 class="wordmark">ANON</h1>
    <p class="tagline">Nobody knows who you are.</p>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" maxlength="14" autocomplete="off" spellcheck="false" placeholder="anon">
    </div>

    <div class="actions">
      <button id="btn-solo" class="ghost">Play solo</button>
      <button id="btn-host" class="primary">Create room</button>
    </div>

    <div class="divider"><span>or join one</span></div>

    <div class="join-row">
      <input id="joincode" type="text" maxlength="5" autocomplete="off" spellcheck="false" placeholder="CODE">
      <button id="btn-join" class="ghost">Join</button>
    </div>

    <p id="title-status" class="status"></p>
  </div>
</div>

<!-- ============================= LOADING ============================= -->
<div id="loading" class="screen hidden">
  <div class="title-inner">
    <h1 class="wordmark small">ANON</h1>
    <p id="loading-text" class="status">Loading character…</p>
    <div class="bar"><div id="bar-fill"></div></div>
    <p id="loading-error" class="error"></p>
  </div>
</div>

<!-- ============================= IN GAME ============================= -->
<div id="roomtag" class="hidden">
  <span class="label">ROOM</span>
  <span id="roomcode">—</span>
  <button id="btn-copy" title="Copy code">copy</button>
</div>

<div id="roster" class="hidden"></div>

<div id="hud" class="hidden">
  <b>WASD</b> move · <b>Space</b> jump · <b>Mouse</b> look · <b>Esc</b> release cursor
</div>

<div id="click" class="hidden">Click to play</div>

<div id="netstatus" class="hidden"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="game.js"></script>
</body>
</html>
